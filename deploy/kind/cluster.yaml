# Local CPU-only cluster for debugging the serving logic for free.
#
# Nothing measured here is a performance number: the Pod that runs on this
# cluster is a stub with vLLM's API and metric contract, not vLLM. See
# deploy/manifests/README.md.
#
# Create with:  kind create cluster --config deploy/kind/cluster.yaml
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: i-serve

nodes:
  # Control plane. Also the ingress node: the label is what the ingress
  # controller's nodeSelector looks for, and the port mappings are what make
  # localhost:8080 reach a Service inside the cluster. Both are set now so the
  # cluster does not have to be rebuilt when ingress arrives.
  - role: control-plane
    image: kindest/node:v1.36.1
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP

  # Two workers, so scheduling is a real question: replica placement, node
  # pressure and anti-affinity all collapse into nothing on a single node.
  - role: worker
    image: kindest/node:v1.36.1
  - role: worker
    image: kindest/node:v1.36.1
