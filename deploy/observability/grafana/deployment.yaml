# Grafana as a renderer of the Prometheus in ../prometheus, and nothing else:
# no database worth keeping, no users, no alerting of its own. Everything it
# shows is provisioned from the files in this directory at start-up, so the
# dashboard is reviewed as a diff and a Pod restart loses nothing. A panel
# edited in the browser is lost on the next roll by design -- the file is the
# dashboard, the UI is a viewer of it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:13.2.1
          env:
            # No login, and read-only. The Service has no Ingress and is
            # reached by port-forward on a laptop cluster, so a password would
            # protect nothing and cost a step at 03:00. Anonymous access is
            # Viewer -- Grafana 13 supports no other anonymous role -- which
            # matches the provider below: the file is the dashboard, the UI
            # shows it. Ad-hoc PromQL goes to Prometheus's own UI on 9090.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            # Nothing leaves the cluster: no update check, no usage report,
            # no news feed on the home page.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          # Measured, not guessed: at a 256Mi limit Grafana 13.2.1 was
          # OOMKilled (exit 137) while rendering the 19-panel dashboard for one
          # viewer, about a minute after start. 512Mi held; ../README.md.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            # Three read-only mounts, one per provisioning concern, so a
            # change to one rolls the Pod without touching the others:
            # where the data comes from, where dashboards are read from, and
            # the dashboards themselves.
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
            # Grafana's own SQLite state -- sessions, the provisioned
            # dashboards' copies. Disposable: everything in it is rebuilt from
            # the three mounts above at the next start.
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          emptyDir: {}
