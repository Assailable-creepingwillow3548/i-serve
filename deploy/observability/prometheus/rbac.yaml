# Prometheus discovers its targets by asking the API server what exists, so it
# needs read access to the objects it discovers from. The verbs are the whole
# permission: list and watch to build and maintain the target set, get for the
# occasional direct read. Nothing here can write.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  # Cluster-scoped and not namespaced, because discovery reads the `llm`
  # namespace from a Pod running in `monitoring`. A Role would not reach.
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
